<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ModelStash icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16132e" />
      <stop offset="55%" stop-color="#3a2fb8" />
      <stop offset="100%" stop-color="#7d71f0" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- a stash of models: three stacked layers -->
