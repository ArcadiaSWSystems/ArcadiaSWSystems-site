  <path d="M116,256 L256,326 L396,256" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
  <path d="M256,126 L396,196 L256,266 L116,196 Z" fill="#ffffff" stroke="#ffffff" stroke-width="24" stroke-linejoin="round" />
